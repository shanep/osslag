[package]
name = "osslag"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Technical Lag tools for Open Source Software Projects"
license = "MIT"
repository = "https://github.com/shanep/osslag"
homepage = "https://github.com/shanep/osslag"
readme = "README.md"
categories = ["command-line-utilities", "science", "development-tools"]
exclude = [".github/", ".githooks/", ".vscode/", "Makefile", "rustfmt.toml", "env.template", "docs/"]
keywords = ["oss", "technical-lag", "software-maintenance"]

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false, features = ["prettyprint"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
dotenvy = "0.15.7"
git2 = { version = "0.21.0", default-features = false, features = ["https", "vendored-libgit2"] }
indicatif = "0.18.6"
parquet = { version = "60", default-features = false, features = ["arrow", "snap", "zstd"] }
ratatui = "0.29.0"
rayon = "1"
regex = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry"] }
xz2 = "0.1.7"

[dev-dependencies]
arrow = { version = "60", default-features = false, features = ["chrono-tz"] }
approx = "0.5"
tempfile = "3"
insta = "1.49.0"

[profile.release]
lto = "thin"
